<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Запись на выступления</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #151a24;
      --input-bg: #0e121a;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 14px;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12), transparent 60%);
      color: var(--text);
      min-height: 100vh;
    }

    /* Верхняя строка: вкладки слева + вход для старосты справа */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--card);
      color: var(--muted);
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .tab-count {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.28);
      color: inherit;
    }
    .tab-btn.add-btn {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
    }

    /* Кнопка старосты сверху справа */
    .admin-btn {
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--card);
      color: var(--muted);
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .admin-btn.logged-in {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
    }

    /* Блоки без рамок (borderless) */
    .card {
      background: var(--card);
      border: none;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }
    .event-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 4px 0;
    }
    .event-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .progress-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #10b981);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 500;
    }
    input, select, textarea {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 14px;
      background: var(--input-bg);
      color: var(--text);
      border: none;
      outline: none;
    }
    textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.4;
    }

    button.primary {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    button.primary:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

    button.danger {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      border: none;
      padding: 7px 11px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .icon-btn.delete-event {
      color: #f87171;
      background: rgba(239, 68, 68, 0.14);
    }

    /* Уведомления */
    .status-msg {
      font-size: 13px;
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      display: none;
      font-weight: 500;
    }
    .status-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
    }
    .status-msg.ok {
      display: block;
      background: rgba(16, 185, 129, 0.16);
      color: #6ee7b7;
    }

    .my-booking-box {
      background: rgba(16, 185, 129, 0.1);
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .my-booking-title {
      color: #34d399;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px;
    }

    /* Таблица очереди */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td {
      text-align: left;
      padding: 11px 8px;
      vertical-align: middle;
    }
    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      padding-top: 2px;
    }
    tbody tr {
      border-radius: 10px;
    }
    tbody tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    .slot-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      padding: 0 6px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
    }
    .row-taken .slot-badge {
      background: rgba(99, 102, 241, 0.22);
      color: #a5b4fc;
    }
    .row-mine {
      background: rgba(99, 102, 241, 0.1) !important;
    }
    .row-mine .slot-badge {
      background: var(--accent);
      color: #fff;
    }
    .free-label {
      color: rgba(156, 163, 175, 0.4);
      font-style: italic;
    }
    .username {
      color: var(--muted);
      font-size: 12px;
      display: block;
      margin-top: 2px;
    }
    .kick-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: none;
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    /* Модальные окна без рамок */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: var(--card);
      border: none;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.65);
    }

    .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 6px;
      box-shadow: 0 0 8px #10b981;
    }
  </style>
</head>
<body>

  <!-- Верхняя панель: вкладки выступлений слева и кнопка Старосты справа -->
  <div class="top-bar">
    <div class="tabs-bar" id="eventsTabs"></div>
    <button id="adminToggleBtn" class="admin-btn" onclick="handleAdminButtonClick()">
      🔒 Староста
    </button>
  </div>

  <div id="statusBox" class="status-msg"></div>

  <!-- Основной контент выбранного выступления -->
  <div id="eventContent">
    <div class="card">
      <div class="event-header">
        <div>
          <h2 class="event-title" id="currentEventTitle">Загрузка...</h2>
          <div class="event-meta" id="currentEventMeta"></div>
        </div>
        <button id="deleteEventBtn" class="icon-btn delete-event" style="display: none;" onclick="deleteCurrentEvent()">
          Удалить очередь
        </button>
      </div>

      <div class="progress-track">
        <div id="progressBar" class="progress-fill" style="width: 0%;"></div>
      </div>

      <!-- Форма записи -->
      <div id="bookingForm">
        <label for="slotSelect">Свободное место в очереди:</label>
        <select id="slotSelect"></select>

        <label for="topicSelect">Свободная тема:</label>
        <select id="topicSelect"></select>

        <button class="primary" id="bookBtn" onclick="bookSlot()">Записаться на выступление</button>
      </div>

      <!-- Блок, если пользователь уже записан -->
      <div id="myBookingCard" style="display: none;">
        <div class="my-booking-box">
          <div class="my-booking-title">✓ Вы записаны на это выступление</div>
          <div style="font-size: 13px; line-height: 1.5;">
            Место в очереди: <b id="mySlot"></b><br/>
            Выбранная тема: <b id="myTopic"></b>
          </div>
        </div>
        <button class="danger" id="cancelBtn" onclick="cancelSlot()">Отменить мою запись</button>
      </div>
    </div>

    <!-- Таблица очереди -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="margin: 0; font-size: 16px; display: flex; align-items: center;">
          <span class="live-dot" title="Обновляется в реальном времени"></span>
          Таблица очереди
        </h3>
        <span style="font-size: 11px; color: var(--muted);">Live-обновление</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 44px;">№</th>
              <th>Участник</th>
              <th>Тема выступления</th>
              <th id="adminActionHeader" style="width: 36px; display: none;"></th>
            </tr>
          </thead>
          <tbody id="queueTableBody">
            <tr><td colspan="4" class="free-label">Загрузка данных...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Модальное окно входа для старосты -->
  <div id="adminLoginModal" class="modal-backdrop">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h3 style="margin: 0; font-size: 17px;">Вход для старосты</h3>
        <button class="icon-btn" onclick="closeAdminModal()">✕</button>
      </div>

      <label for="adminLoginInput">Логин старосты:</label>
      <input id="adminLoginInput" type="text" placeholder="Введите логин" autocomplete="username" />

      <label for="adminPassInput">Пароль:</label>
      <input id="adminPassInput" type="password" placeholder="Введите пароль" autocomplete="current-password" />

      <button class="primary" id="loginSubmitBtn" onclick="submitAdminLogin()">Войти</button>
    </div>
  </div>

  <!-- Модальное окно создания новой записи (доступно только старосте) -->
  <div id="createModal" class="modal-backdrop">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h3 style="margin: 0; font-size: 17px;">Новая запись на выступление</h3>
        <button class="icon-btn" onclick="closeCreateModal()">✕</button>
      </div>

      <label for="newEventTitle">Название (предмет, дата или семинар):</label>
      <input id="newEventTitle" type="text" placeholder="Например: Семинар 4 — Доклады" />

      <label for="newEventSlots">Количество мест в очереди:</label>
      <input id="newEventSlots" type="number" min="1" max="100" value="15" />

      <label for="newEventTopics">Список тем (каждая тема с новой строки):</label>
      <textarea id="newEventTopics" placeholder="Тема 1. Введение&#10;Тема 2. Аналитика&#10;(если оставить пустым, темы пронумеруются автоматически)"></textarea>

      <button class="primary" id="createEventBtn" onclick="createNewEvent()">Создать запись</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const currentUser = tg.initDataUnsafe?.user || {
      id: 'local_test_user',
      first_name: 'Тестовый',
      last_name: 'Пользователь',
      username: 'test_user'
    };

    let allEvents = [];
    let selectedEventId = null;

    let adminCreds = JSON.parse(localStorage.getItem('tg_queue_admin_creds') || 'null');

    let lastOptionsSignature = '';

    function showStatus(text, isError = false) {
      const box = document.getElementById('statusBox');
      box.textContent = text;
      box.className = 'status-msg ' + (isError ? 'error' : 'ok');
      clearTimeout(window._statusTimer);
      window._statusTimer = setTimeout(() => { box.className = 'status-msg'; }, 4200);
    }

    function updateAdminButtonUI() {
      const btn = document.getElementById('adminToggleBtn');
      if (adminCreds) {
        btn.textContent = '👑 Староста (Выйти)';
        btn.classList.add('logged-in');
      } else {
        btn.textContent = '🔒 Староста';
        btn.classList.remove('logged-in');
      }
    }

    function handleAdminButtonClick() {
      if (adminCreds) {
        if (confirm('Выйти из режима старосты?')) {
          adminCreds = null;
          localStorage.removeItem('tg_queue_admin_creds');
          lastOptionsSignature = '';
          updateAdminButtonUI();
          renderUI();
          showStatus('Вы вышли из режима старосты');
        }
      } else {
        document.getElementById('adminLoginModal').classList.add('open');
      }
    }

    function closeAdminModal() {
      document.getElementById('adminLoginModal').classList.remove('open');
    }

    async function submitAdminLogin() {
      const adminLogin = document.getElementById('adminLoginInput').value.trim();
      const adminPassword = document.getElementById('adminPassInput').value;
      const btn = document.getElementById('loginSubmitBtn');
      btn.disabled = true;

      try {
        const res = await fetch('/api/queue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'admin_login', adminLogin, adminPassword })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Ошибка входа');

        adminCreds = { login: adminLogin, password: adminPassword };
        localStorage.setItem('tg_queue_admin_creds', JSON.stringify(adminCreds));
        document.getElementById('adminPassInput').value = '';
        closeAdminModal();
        lastOptionsSignature = '';
        updateAdminButtonUI();
        renderUI();
        showStatus('Режим старосты активирован! Теперь вы можете управлять очередями.');
      } catch (e) {
        showStatus(e.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    async function loadEvents(isBackgroundPoll = false) {
      try {
        const res = await fetch('/api/queue?t=' + Date.now());
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Ошибка загрузки');

        allEvents = data.events || [];
        if (allEvents.length > 0 && !allEvents.some(e => e.id === selectedEventId)) {
          selectedEventId = allEvents[0].id;
          lastOptionsSignature = '';
        }
        renderUI(isBackgroundPoll);
      } catch (e) {
        if (!isBackgroundPoll) showStatus(e.message, true);
      }
    }

    function renderUI(isBackgroundPoll = false) {
      renderTabs();
      const currentEvent = allEvents.find(e => e.id === selectedEventId);
      const contentEl = document.getElementById('eventContent');

      if (!currentEvent) {
        contentEl.style.display = 'none';
        return;
      }
      contentEl.style.display = 'block';

      const bookings = currentEvent.bookings || [];
      const takenCount = bookings.length;
      const totalSlots = currentEvent.totalSlots;

      document.getElementById('currentEventTitle').textContent = currentEvent.title;
      document.getElementById('currentEventMeta').textContent =
        `Занято мест: ${takenCount} из ${totalSlots} • Свободно тем: ${Math.max(0, currentEvent.topics.length - takenCount)}`;

      const isAdmin = Boolean(adminCreds);
      document.getElementById('deleteEventBtn').style.display = isAdmin ? 'inline-block' : 'none';
      document.getElementById('adminActionHeader').style.display = isAdmin ? 'table-cell' : 'none';

      const percent = totalSlots > 0 ? Math.min(100, Math.round((takenCount / totalSlots) * 100)) : 0;
      document.getElementById('progressBar').style.width = `${percent}%`;

      const myEntry = bookings.find(b => String(b.userId) === String(currentUser.id));
      const formEl = document.getElementById('bookingForm');
      const myCardEl = document.getElementById('myBookingCard');

      if (myEntry) {
        formEl.style.display = 'none';
        myCardEl.style.display = 'block';
        document.getElementById('mySlot').textContent = `№${myEntry.slot}`;
        document.getElementById('myTopic').textContent = myEntry.topic;
        lastOptionsSignature = 'BOOKED';
      } else {
        formEl.style.display = 'block';
        myCardEl.style.display = 'none';

        const takenSlots = new Set(bookings.map(b => Number(b.slot)));
        const takenTopics = new Set(bookings.map(b => b.topic));

        const freeSlots = [];
        for (let i = 1; i <= totalSlots; i++) {
          if (!takenSlots.has(i)) freeSlots.push(i);
        }
        const freeTopics = currentEvent.topics.filter(t => !takenTopics.has(t));

        const newSignature = `${ currentEvent.id }|${ freeSlots.join(',') }|${ freeTopics.join('||') }`;
        if (newSignature !== lastOptionsSignature) {
          const slotSelect = document.getElementById('slotSelect');
          const topicSelect = document.getElementById('topicSelect');

          const prevSlot = slotSelect.value;
          const prevTopic = topicSelect.value;

          slotSelect.innerHTML = '';
          freeSlots.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = `Место №${s}`;
            slotSelect.appendChild(opt);
          });

          topicSelect.innerHTML = '';
          freeTopics.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t;
            opt.textContent = t;
            topicSelect.appendChild(opt);
          });
и
          if (prevSlot && freeSlots.includes(Number(prevSlot))) {
            slotSelect.value = prevSlot;
          } else if (isBackgroundPoll && prevSlot && lastOptionsSignature !== '' && lastOptionsSignature !== 'BOOKED') {
            showStatus(`⚡ Место №${prevSlot} только что заняли! Выберите другое.`, true);
          }

          if (prevTopic && freeTopics.includes(prevTopic)) {
            topicSelect.value = prevTopic;
          } else if (isBackgroundPoll && prevTopic && lastOptionsSignature !== '' && lastOptionsSignature !== 'BOOKED') {
            showStatus(`⚡ Тему «${prevTopic}» только что забрали! Список обновлен.`, true);
          }

          document.getElementById('bookBtn').disabled =
            freeSlots.length === 0 || freeTopics.length === 0;

          lastOptionsSignature = newSignature;
        }
      }

      const tbody = document.getElementById('queueTableBody');
      tbody.innerHTML = '';

      const bookingBySlot = {};
      bookings.forEach(b => { bookingBySlot[Number(b.slot)] = b; });

      for (let i = 1; i <= totalSlots; i++) {
        const entry = bookingBySlot[i];
        const tr = document.createElement('tr');

        if (entry) {
          const isMe = String(entry.userId) === String(currentUser.id);
          tr.className = 'row-taken' + (isMe ? ' row-mine' : '');
          tr.innerHTML = `
            <td><span class="slot-badge">${i}</span></td>
            <td>
              <strong>${escapeHtml(entry.userName)}</strong>
              ${entry.username ? `<span class="username">${escapeHtml(entry.username)}</span>` : ''}
            </td>
            <td>${escapeHtml(entry.topic)}</td>
            ${isAdmin ? `<td><button class="kick-btn" title="Освободить место" onclick="adminRemoveSlot(${i})">✕</button></td>` : ''}
          `;
        } else {
          tr.innerHTML = `
            <td><span class="slot-badge">${i}</span></td>
            <td class="free-label">Свободно</td>
            <td class="free-label">—</td>
            ${isAdmin ? `<td></td>` : ''}
          `;
        }
        tbody.appendChild(tr);
      }
    }

    function renderTabs() {
      const container = document.getElementById('eventsTabs');
      container.innerHTML = '';

      allEvents.forEach(ev => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (ev.id === selectedEventId ? ' active' : '');
        const count = (ev.bookings || []).length;
        btn.innerHTML = `
          <span>${escapeHtml(ev.title)}</span>
          <span class="tab-count">${count}/${ev.totalSlots}</span>
        `;
        btn.onclick = () => {
          selectedEventId = ev.id;
          lastOptionsSignature = '';
          renderUI();
        };
        container.appendChild(btn);
      });

      if (adminCreds) {
        const addBtn = document.createElement('button');
        addBtn.className = 'tab-btn add-btn';
        addBtn.textContent = '+ Добавить запись';
        addBtn.onclick = openCreateModal;
        container.appendChild(addBtn);
      }
    }

    function openCreateModal() {
      document.getElementById('createModal').classList.add('open');
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.remove('open');
    }

    async function createNewEvent() {
      if (!adminCreds) return;
      const title = document.getElementById('newEventTitle').value.trim();
      const totalSlots = Number(document.getElementById('newEventSlots').value) || 15;
      const rawTopics = document.getElementById('newEventTopics').value;
      const topics = rawTopics.split('\n').map(s => s.trim()).filter(Boolean);

      if (!title) {
        showStatus('Укажите название выступления', true);
        return;
      }

      const btn = document.getElementById('createEventBtn');
      btn.disabled = true;

      try {
        const res = await fetch('/api/queue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'create_event',
            title,
            totalSlots,
            topics,
            adminLogin: adminCreds.login,
            adminPassword: adminCreds.password
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Ошибка создания записи');

        allEvents = data.events;
        selectedEventId = data.newEventId;
        lastOptionsSignature = '';
        document.getElementById('newEventTitle').value = '';
        document.getElementById('newEventTopics').value = '';
        closeCreateModal();
        renderUI();
        showStatus('Новая очередь создана!');
      } catch (e) {
        showStatus(e.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteCurrentEvent() {
      if (!selectedEventId || !adminCreds) return;
      if (!confirm('Удалить эту запись на выступление вместе со всей очередью?')) return;

      try {
        const res = await fetch('/api/queue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'delete_event',
            eventId: selectedEventId,
            adminLogin: adminCreds.login,
            adminPassword: adminCreds.password
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Ошибка удаления');

        allEvents = data.events;
        selectedEventId = allEvents[0]?.id || null;
        lastOptionsSignature = '';
        renderUI();
        showStatus('Очередь удалена');
      } catch (e) {
        showStatus(e.message, true);
      }
    }

    async function adminRemoveSlot(slotNum) {
      if (!adminCreds) return;
      if (!confirm(`Освободить место №${slotNum} в этой очереди?`)) return;

      try {
        const res = await fetch('/api/queue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'admin_remove_booking',
            eventId: selectedEventId,
            slot: slotNum,
            adminLogin: adminCreds.login,
            adminPassword: adminCreds.password
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Ошибка удаления записи');

        allEvents = data.events;
        lastOptionsSignature = '';
        renderUI();
        showStatus(`Место №${slotNum} освобождено старостой`);
      } catch (e) {
        showStatus(e.message, true);
      }
    }

    async function bookSlot() {
      const slot = document.getElementById('slotSelect').value;
      const topic = document.getElementById('topicSelect').value;
      const btn = document.getElementById('bookBtn');
      btn.disabled = true;

      try {
        const res = await fetch('/api/queue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'book',
            eventId: selectedEventId,
            slot,
            topic,
            user: currentUser
          })
        });
        const data = await res.json();

        if (data.events) {
          allEvents = data.events;
          lastOptionsSignature = '';
          renderUI();
        }

        if (!res.ok) throw new Error(data.error || 'Не удалось записаться');
        showStatus('Вы успешно записались в очередь!');
      } catch (e) {
        showStatus(e.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    async function cancelSlot() {
      const btn = document.getElementById('cancelBtn');
      btn.disabled = true;

      try {
        const res = await fetch('/api/queue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'cancel',
            eventId: selectedEventId,
            user: currentUser
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Ошибка отмены');

        allEvents = data.events;
        lastOptionsSignature = '';
        renderUI();
        showStatus('Запись отменена. Место и тема снова свободны.');
      } catch (e) {
        showStatus(e.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    updateAdminButtonUI();
    loadEvents(false);

    setInterval(() => {
      if (!document.hidden) loadEvents(true);
    }, 1500);
  </script>
</body>
</html>
